<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#dc2626">
    <title>Live Bus Tracker</title>
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .progress-bar {
            transition: width 1s linear;
        }
        .tab-btn {
            position: relative;
            transition: all 0.2s ease-in-out;
        }
        .tab-btn.active {
            background-color: #ef4444;
            color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.3), 0 2px 4px -1px rgba(239, 68, 68, 0.06);
        }
        .spin {
            animation: fa-spin 1s infinite linear;
        }
        /* Custom scrollbar for bus lists */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-gray-100 to-red-50 text-gray-800 min-h-screen flex flex-col items-center p-3 sm:p-6 md:p-8 font-sans antialiased">

    <main class="w-full max-w-lg bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100 flex flex-col transition-all">
        <!-- Top App Header -->
        <header class="bg-gradient-to-r from-red-600 via-red-650 to-red-700 text-white p-5 pb-4 relative">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-white bg-opacity-20 flex items-center justify-center text-white shadow-inner">
                        <i class="fas fa-bus text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight">Live Bus Tracker</h1>
                        <p class="text-xs text-red-100 font-medium">Routes 298 &bull; 313</p>
                    </div>
                </div>

                <!-- Manual refresh button & status -->
                <div class="flex items-center space-x-2">
                    <button id="manualRefreshBtn" title="Refresh departures" class="w-10 h-10 rounded-xl bg-white bg-opacity-15 hover:bg-opacity-25 active:scale-95 transition flex items-center justify-center text-white focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-50">
                        <i id="refreshIcon" class="fas fa-sync-alt text-base"></i>
                    </button>
                </div>
            </div>

            <!-- Auto Refresh Progress Bar -->
            <div class="mt-4 bg-red-900 bg-opacity-30 rounded-full h-1 overflow-hidden">
                <div id="refreshProgress" class="progress-bar bg-white bg-opacity-80 h-full w-full"></div>
            </div>

            <div class="mt-2 flex justify-between items-center text-[11px] text-red-100 font-medium">
                <span id="refreshStatus" class="flex items-center">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
                    Live TfL Feed
                </span>
                <span id="lastUpdatedTime">Updating...</span>
            </div>
        </header>

        <!-- Segmented Tab Navigation -->
        <div class="p-4 sm:p-5 pb-2">
            <div id="tabContainer" class="bg-gray-100 p-1.5 rounded-2xl flex space-x-1.5 border border-gray-200">
                <!-- Dynamically populated buttons -->
            </div>
        </div>

        <!-- Bus Stop Cards Container -->
        <div id="busInfo" class="px-4 sm:px-5 pb-5 space-y-4 flex-1">
            <div class="py-12 flex flex-col items-center justify-center text-gray-400 space-y-3">
                <i class="fas fa-circle-notch spin text-3xl text-red-500"></i>
                <p class="text-sm font-medium">Fetching arrivals...</p>
            </div>
        </div>

        <!-- Footnote / Quick Info -->
        <footer class="bg-gray-50 border-t border-gray-100 px-5 py-3 text-center text-xs text-gray-500 flex justify-between items-center">
            <span class="flex items-center">
                <i class="fas fa-satellite-dish mr-1 text-red-500"></i> Auto-updates every 30s
            </span>
            <span class="text-gray-400">Powered by TfL Open Data</span>
        </footer>
    </main>

    <div id="offlineToast" class="fixed bottom-4 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg flex items-center space-x-2 pointer-events-none">
        <i class="fas fa-exclamation-triangle text-amber-400"></i>
        <span id="offlineToastMessage">Connection error. Retrying...</span>
    </div>

    <script>
        // Stop Configuration
        const STOP_CATEGORIES = {
            'From Home': [
                { id: '210021000520', name: 'Highview Gardens', subtitle: 'Towards Potters Bar', lines: ['298', '313'] },
                { id: '210021001540', name: 'Park Avenue', subtitle: 'Towards London', lines: ['298', '313'] }
            ],
            'To Home': [
                { id: '210021000010', name: 'Potters Bar Station', subtitle: 'Stop A / Forecourt', lines: ['298', '313'] },
                { id: '210021000020', name: 'Potters Bar Station', subtitle: 'Stop B / Forecourt', lines: ['298', '313'] },
                { id: '490000053A', name: 'Cockfosters Station', subtitle: 'Stop A', lines: ['298'] },
                { id: '490000210G', name: 'Southgate Station', subtitle: 'Stop G', lines: ['298'] },
                { id: '490000009W1', name: 'Arnos Grove Station', subtitle: 'Stop W1', lines: ['298'] }
            ]
        };

        const REFRESH_INTERVAL_SEC = 30;
        let currentTab = Object.keys(STOP_CATEGORIES)[0];
        let arrivalsData = {}; // keyed by stop.id
        let isRefreshing = false;
        let secondsRemaining = REFRESH_INTERVAL_SEC;
        let countdownTimer = null;
        let lastSuccessTime = null;

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            setupTabs();
            startRefreshTimer();
            refreshActiveStops();

            document.getElementById('manualRefreshBtn').addEventListener('click', () => {
                resetCountdown();
                refreshActiveStops();
            });

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    resetCountdown();
                    refreshActiveStops();
                }
            });
        });

        // Tab Setup
        function setupTabs() {
            const tabContainer = document.getElementById('tabContainer');
            tabContainer.innerHTML = '';

            Object.keys(STOP_CATEGORIES).forEach((category) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn flex-1 py-2 px-3 text-xs sm:text-sm font-semibold rounded-xl transition ${
                    category === currentTab ? 'active' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-200'
                }`;
                btn.textContent = category;
                btn.onclick = () => selectTab(category);
                tabContainer.appendChild(btn);
            });
        }

        function selectTab(category) {
            if (currentTab === category) return;
            currentTab = category;

            // Update tab UI
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => {
                if (btn.textContent === category) {
                    btn.classList.add('active');
                    btn.classList.remove('text-gray-600', 'hover:text-gray-900', 'hover:bg-gray-200');
                } else {
                    btn.classList.remove('active');
                    btn.classList.add('text-gray-600', 'hover:text-gray-900', 'hover:bg-gray-200');
                }
            });

            // Re-render UI immediately with existing cached state, then refresh current
            renderStopSections();
            refreshActiveStops();
        }

        // Countdown & Auto Refresh
        function startRefreshTimer() {
            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                secondsRemaining--;
                const percentage = Math.max(0, (secondsRemaining / REFRESH_INTERVAL_SEC) * 100);
                const progressBar = document.getElementById('refreshProgress');
                if (progressBar) {
                    progressBar.style.width = `${percentage}%`;
                }

                if (secondsRemaining <= 0) {
                    resetCountdown();
                    refreshActiveStops();
                }
            }, 1000);
        }

        function resetCountdown() {
            secondsRemaining = REFRESH_INTERVAL_SEC;
            const progressBar = document.getElementById('refreshProgress');
            if (progressBar) {
                progressBar.style.width = '100%';
            }
        }

        // Format arrival display
        function formatMinutes(seconds) {
            if (seconds < 45) return 'Due';
            const mins = Math.round(seconds / 60);
            return `${mins} min`;
        }

        function formatClockTime(isoString) {
            if (!isoString) return '';
            try {
                const d = new Date(isoString);
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch {
                return '';
            }
        }

        // Fetch arrivals for active tab stops only (low latency + clean state)
        async function refreshActiveStops() {
            if (isRefreshing) return;
            isRefreshing = true;

            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.classList.add('spin');

            const stopsToFetch = STOP_CATEGORIES[currentTab] || [];
            let hadErrors = false;

            // Fetch concurrently
            const fetchPromises = stopsToFetch.map(async (stop) => {
                try {
                    const response = await fetch(`https://api.tfl.gov.uk/StopPoint/${stop.id}/Arrivals`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    
                    // Filter lines and sort by timeToStation
                    const filtered = data
                        .filter(item => stop.lines.includes(item.lineId))
                        .sort((a, b) => a.timeToStation - b.timeToStation);

                    arrivalsData[stop.id] = {
                        data: filtered,
                        timestamp: Date.now(),
                        error: null
                    };
                } catch (err) {
                    console.error(`Error loading arrivals for ${stop.name} (${stop.id}):`, err);
                    hadErrors = true;
                    if (!arrivalsData[stop.id]) {
                        arrivalsData[stop.id] = { data: [], timestamp: Date.now(), error: err.message };
                    }
                }
            });

            await Promise.all(fetchPromises);

            isRefreshing = false;
            refreshIcon.classList.remove('spin');
            lastSuccessTime = new Date();

            if (hadErrors) {
                showToast('Some stops could not be updated');
            }

            updateStatusHeader();
            renderStopSections();
        }

        function updateStatusHeader() {
            const timeEl = document.getElementById('lastUpdatedTime');
            if (lastSuccessTime) {
                const formatted = lastSuccessTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                timeEl.textContent = `Updated ${formatted}`;
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('offlineToast');
            const messageEl = document.getElementById('offlineToastMessage');
            messageEl.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Render Stop Sections
        function renderStopSections() {
            const container = document.getElementById('busInfo');
            const stops = STOP_CATEGORIES[currentTab] || [];

            if (stops.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-500 text-sm">No stops configured.</div>`;
                return;
            }

            container.innerHTML = '';

            stops.forEach(stop => {
                const stopResult = arrivalsData[stop.id];
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl border border-gray-150 shadow-sm hover:shadow-md transition p-3.5 sm:p-4';

                // Stop Header
                let headerHtml = `
                    <div class="flex items-start justify-between mb-3 border-b border-gray-100 pb-2.5">
                        <div>
                            <h2 class="font-bold text-gray-900 text-sm sm:text-base flex items-center">
                                <span class="w-2 h-2 rounded-full bg-red-600 inline-block mr-2"></span>
                                ${stop.name}
                            </h2>
                            <p class="text-xs text-gray-500 font-medium pl-4">${stop.subtitle || 'Live departures'}</p>
                        </div>
                        <div class="flex space-x-1">
                            ${stop.lines.map(line => `
                                <span class="bg-gray-100 text-gray-600 border border-gray-200 text-[10px] font-bold px-1.5 py-0.5 rounded">
                                    ${line}
                                </span>
                            `).join('')}
                        </div>
                    </div>
                `;

                // Content
                let contentHtml = '';
                if (!stopResult) {
                    contentHtml = `
                        <div class="py-4 text-center text-gray-400 text-xs animate-pulse-subtle flex items-center justify-center space-x-2">
                            <i class="fas fa-spinner spin text-red-400"></i>
                            <span>Checking arrivals...</span>
                        </div>
                    `;
                } else if (stopResult.error && stopResult.data.length === 0) {
                    contentHtml = `
                        <div class="p-3 bg-red-50 text-red-700 rounded-xl text-xs flex items-center space-x-2">
                            <i class="fas fa-exclamation-circle text-red-500"></i>
                            <span>Unable to load arrivals for this stop</span>
                        </div>
                    `;
                } else if (stopResult.data.length === 0) {
                    contentHtml = `
                        <div class="py-3 px-3 bg-gray-50 rounded-xl text-center text-xs text-gray-500 font-medium flex items-center justify-center space-x-2">
                            <i class="fas fa-clock text-gray-400"></i>
                            <span>No buses currently tracked</span>
                        </div>
                    `;
                } else {
                    const arrivalsHtml = stopResult.data.map((bus, idx) => {
                        const isDue = bus.timeToStation < 60;
                        const etaText = formatMinutes(bus.timeToStation);
                        const clockTime = formatClockTime(bus.expectedArrival);

                        return `
                            <div class="flex items-center justify-between p-2.5 rounded-xl ${
                                idx % 2 === 0 ? 'bg-slate-50' : 'bg-white'
                            } hover:bg-red-50 transition border border-transparent hover:border-red-100">
                                <div class="flex items-center space-x-3">
                                    <!-- London Red Bus Route Badge -->
                                    <span class="bg-red-600 text-white font-extrabold text-xs px-2.5 py-1 rounded-md shadow-sm min-w-[42px] text-center tracking-tight">
                                        ${bus.lineId}
                                    </span>
                                    <div>
                                        <div class="font-semibold text-gray-800 text-xs sm:text-sm">
                                            ${bus.destinationName}
                                        </div>
                                        ${bus.towards ? `
                                            <div class="text-[11px] text-gray-400">
                                                towards ${bus.towards}
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="inline-flex items-center px-2 py-0.5 rounded-md font-bold text-xs ${
                                        isDue 
                                            ? 'bg-amber-100 text-amber-800 animate-pulse' 
                                            : 'bg-indigo-50 text-indigo-700'
                                    }">
                                        ${etaText}
                                    </div>
                                    ${clockTime ? `
                                        <div class="text-[10px] text-gray-400 font-mono mt-0.5">
                                            ${clockTime}
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    }).join('');

                    contentHtml = `<div class="space-y-1.5">${arrivalsHtml}</div>`;
                }

                card.innerHTML = headerHtml + contentHtml;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
